<!DOCTYPE html>
<html>
<head>
    <title>Device Detection System</title>
</head>

<body>

<h1>Unauthorized Device Detection System</h1>

<p>Network Security Dashboard</p>

<form action="/scan" method="get">
    <button type="submit">Scan Network</button>
</form>

<h2>Detected Devices</h2>

<table border="1" cellpadding="10">

<tr>
    <th>IP Address</th>
    <th>MAC Address</th>
    <th>Status</th>
    <th>AI Analysis</th>
</tr>

{% for device in devices %}
<tr>
    <td>{{ device.ip }}</td>
    <td>{{ device.mac }}</td>
    <td>{{ device.status }}</td>
    <td>{{ device.ai }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
